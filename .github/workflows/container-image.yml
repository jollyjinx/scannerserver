name: Container Image

on:
  push:
    branches:
      - main
      - development
    tags:
      - "*"
  pull_request:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/jollyjinx/scannerserver

jobs:
  swift-test:
    name: Swift 6.3.2 Tests
    runs-on: ubuntu-latest
    container: swift:6.3.2-noble

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native document tools
        run: |
          sed -i 's/ noble-backports//g' /etc/apt/sources.list.d/ubuntu.sources
          apt-get update
          apt-get install -y --no-install-recommends libvips-tools poppler-utils qpdf
          rm -rf /var/lib/apt/lists/*

      - name: Run Swift tests
        env:
          SCANNERSERVER_REQUIRE_NATIVE_TOOL_TESTS: "1"
        run: swift test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - swift-test
      - container-smoke

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  container-smoke:
    name: Container Smoke
    runs-on: ubuntu-latest
    needs: swift-test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build current-platform image
        run: docker build --tag scannerserver:ci .

      - name: Exercise runtime contract
        env:
          CONTAINER_COMMAND: docker
        run: ./scripts/smoke_swift_container.sh scannerserver:ci
