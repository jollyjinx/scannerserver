name: Container Image

on:
  push:
    branches:
      - main
      - development
    tags:
      - "*"
  pull_request:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-test:
    name: Swift 6.3.2 Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Swift tests
        env:
          SCANNERSERVER_REQUIRE_NATIVE_TOOL_TESTS: "1"
        run: |
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            --workdir /workspace \
            --env SCANNERSERVER_REQUIRE_NATIVE_TOOL_TESTS \
            swift:6.3.2-noble \
            sh -c "
              sed -i 's/ noble-backports//g' /etc/apt/sources.list.d/ubuntu.sources
              apt-get update
              apt-get install -y --no-install-recommends libvips-tools poppler-utils qpdf
              rm -rf /var/lib/apt/lists/*
              swift test --scratch-path /tmp/scannerserver-build
            "

  build:
    name: Build
    if: ${{ github.server_url == 'https://github.com' }}
    needs:
      - swift-test
      - container-smoke
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      meta-images: ghcr.io/jollyjinx/scannerserver
      meta-tags: |
        type=ref,event=branch
        type=ref,event=tag
        type=sha,prefix=sha-
        type=raw,value=latest,enable={{is_default_branch}}
      build-args: |
        VCS_REF=${{ github.sha }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  container-smoke:
    name: Container Smoke
    runs-on: ubuntu-latest
    needs: swift-test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Gitmaster ARM64 image
        if: ${{ github.server_url == 'https://gitmaster.jinx.eu' }}
        run: docker build --platform linux/arm64 --tag scannerserver:ci .

      - name: Build current-platform image
        if: ${{ github.server_url != 'https://gitmaster.jinx.eu' }}
        run: docker build --tag scannerserver:ci .

      - name: Exercise runtime contract
        env:
          CONTAINER_COMMAND: docker
        run: ./scripts/smoke_swift_container.sh scannerserver:ci
