name: Container Image

on:
  push:
    branches:
      - "**"
    tags:
      - "*"
  pull_request:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-test:
    name: Swift 6.3.2 Tests
    if: ${{ github.server_url == 'https://gitmaster.jinx.eu' || github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Swift tests
        env:
          CONTAINER_COMMAND: docker
          SCANNERSERVER_REQUIRE_NATIVE_TOOL_TESTS: "1"
        run: ./scripts/run_swift_tests_in_container.sh

  build:
    name: Build
    if: ${{ github.server_url == 'https://github.com' }}
    needs:
      - swift-test
      - container-smoke
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      meta-images: ghcr.io/jollyjinx/scannerserver
      meta-tags: |
        type=ref,event=branch
        type=ref,event=tag
        type=sha,prefix=sha-
        type=raw,value=latest,enable={{is_default_branch}}
      build-args: |
        VCS_REF=${{ github.sha }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  container-smoke:
    name: Container Smoke
    runs-on: ubuntu-latest
    needs: swift-test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Gitmaster ARM64 image
        if: ${{ github.server_url == 'https://gitmaster.jinx.eu' }}
        run: docker build --platform linux/arm64 --build-arg "VCS_REF=${{ github.sha }}" --tag scannerserver:ci .

      - name: Build current-platform image
        if: ${{ github.server_url != 'https://gitmaster.jinx.eu' }}
        run: docker build --tag scannerserver:ci .

      - name: Exercise Gitmaster runtime contract
        if: ${{ github.server_url == 'https://gitmaster.jinx.eu' }}
        env:
          CONTAINER_COMMAND: docker
          SCANNERSERVER_SMOKE_HOST: host.docker.internal
          SCANNERSERVER_SMOKE_USE_DOCKER_VOLUMES: "1"
        run: ./scripts/smoke_swift_container.sh scannerserver:ci

      - name: Exercise current-platform runtime contract
        if: ${{ github.server_url != 'https://gitmaster.jinx.eu' }}
        env:
          CONTAINER_COMMAND: docker
          SCANNERSERVER_SMOKE_USE_DOCKER_VOLUMES: "1"
        run: ./scripts/smoke_swift_container.sh scannerserver:ci

      - name: Publish Gitmaster branch image
        if: ${{ github.server_url == 'https://gitmaster.jinx.eu' && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') }}
        env:
          BRANCH_REF: ${{ github.ref }}
          REGISTRY_ACTOR: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          branch_name="${BRANCH_REF#refs/heads/}"
          branch_tag="$(./scripts/container_tag_for_branch.sh "${branch_name}")"
          image="gitmaster.jinx.eu/jnxpublic/scannerserver:${branch_tag}"

          printf '%s' "${REGISTRY_TOKEN}" |
            docker login gitmaster.jinx.eu \
              --username "${REGISTRY_ACTOR}" \
              --password-stdin
          trap 'docker logout gitmaster.jinx.eu >/dev/null 2>&1 || true' EXIT

          docker tag scannerserver:ci "${image}"
          docker push "${image}"
          echo "Published ${image}"
