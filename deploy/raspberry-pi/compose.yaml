services:
  scansnap:
    image: ghcr.io/jollyjinx/scannerserver:latest
    container_name: scannerserver
    hostname: scannerserver
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      SCAN_OUTPUT_DIR: /scans
      SCAN_BACKEND: wifi
      SCAN_LANGUAGE: deu+eng
      SCAN_RESOLUTION: "300"
      SCAN_MODE: Color
      SCAN_SOURCE: ADF Duplex
      SCAN_FORMAT: pdf
      TZ: ${TZ:-Europe/Berlin}
      WEB_PORT: "80"
      SCANNER_IP: ${SCANNER_IP:?set SCANNER_IP in /home/ubuntu/plt/.env}
      SCANSNAP_CLIENT_IP: ${NETWORK_PREFIX}.10.6
      SCANSNAP_BUTTON_SCAN_ENABLED: "true"
      SCANSNAP_BUTTON_PORT: "55265"
      SCANSNAP_BUTTON_ARM_INTERVAL_SECONDS: "60"
      SCANSNAP_BUTTON_ARM_TIMEOUT_SECONDS: "45"
      SCANSNAP_PAIRING_KEY: ${SCANSNAP_PAIRING_KEY:?set SCANSNAP_PAIRING_KEY in /home/ubuntu/plt/.env}
    networks:
      aservice1010:
        ipv4_address: ${NETWORK_PREFIX}.10.6
    mac_address: "da:e0:c0:24:d4:f8"
    volumes:
      - /home/ubuntu/plt/scans:/scans

networks:
  aservice1010:
    external: true
    name: plt_aservice1010
