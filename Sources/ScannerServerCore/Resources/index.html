<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- SCANNER_SERVER_REFRESH -->
    <title>scannerserver</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; --page: #f4f6f5; --panel: #fff; --text: #202124; --muted: #5f6368; --border: #d8ddd8; --primary: #0b57d0; --danger: #b3261e; }
      body { margin: 0; background: var(--page); color: var(--text); }
      main { max-width: 1040px; margin: 0 auto; padding: 28px 20px; }
      .page-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
      h1 { font-size: 28px; margin: 0; } h2 { font-size: 18px; margin-top: 0; } h3 { font-size: 15px; }
      section { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 18px; margin: 16px 0; }
      form, .settings-grid, .setup-controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; align-items: end; }
      .stack-form, .setup-controls, .mode-editor-form { grid-template-columns: 1fr; }
      label { display: grid; gap: 6px; font-size: 14px; font-weight: 600; }
      input, select, button { box-sizing: border-box; font: inherit; min-width: 0; }
      input, select { padding: 9px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); }
      button { padding: 9px 14px; border: 0; border-radius: 6px; background: var(--primary); color: #fff; font-weight: 700; cursor: pointer; }
      button:disabled { opacity: .55; cursor: wait; } .danger-button { background: var(--danger); }
      .secondary-button { background: #e7ecea; color: #27302f; } .button-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
      .mode-load-form { grid-template-columns: minmax(0, 1fr) minmax(140px, .3fr); margin-top: 18px; }
      .mode-editor-form { gap: 18px; margin-top: 18px; align-items: stretch; }
      .setting-group { min-width: 0; margin: 0; padding: 16px 0 0; border: 0; border-top: 1px solid var(--border); }
      .setting-group legend { padding-right: 10px; font-size: 15px; font-weight: 700; }
      .settings-grid { gap: 16px; align-items: start; }
      .settings-grid-four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .settings-grid-two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .processing-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: stretch; }
      .setting-card, .button-setting-card { min-width: 0; padding: 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--page); }
      .setting-card { display: grid; gap: 14px; align-content: start; }
      .button-setting-card { max-width: 520px; }
      .checkbox-setting { align-content: start; } .setting-help { color: var(--muted); font-size: 12px; font-weight: 400; line-height: 1.35; }
      .mode-actions { padding-top: 2px; }
      .notice, .warning { padding: 10px 12px; border-radius: 6px; font-weight: 700; } .notice { background: #e8f0fe; color: #174ea6; } .warning { background: #fef7e0; color: #8f4700; }
      .muted, .file-name { color: var(--muted); font-size: 13px; } .status, .default-badge { font-weight: 700; }
      .scanner-summary { padding: 12px 18px; }
      .scanner-name { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0; }
      .scanner-reachability { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 13px; font-weight: 600; }
      .scanner-reachability-dot { width: 9px; height: 9px; border-radius: 50%; background: #9aa0a6; }
      .scanner-reachability.reachable .scanner-reachability-dot { background: #1e8e3e; }
      .mode-list, .file-list { padding: 0; list-style: none; } .mode-list li, .file-row { border-top: 1px solid var(--border); padding: 10px 0; }
      .advanced-setup { border-top: 1px solid var(--border); margin-top: 18px; padding-top: 18px; }
      .file-groups { grid-column: 1 / -1; } .file-row { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px; }
      .file-preview { width: 112px; height: 148px; object-fit: contain; background: #f1f3f4; }
      .file-variant { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; } a { color: var(--primary); }
      @media (prefers-color-scheme: dark) { :root { --page: #171918; --panel: #232624; --text: #f1f3f4; --muted: #b5b9b6; --border: #464b47; } .secondary-button { background: #3b413d; color: #fff; } }
      @media (max-width: 800px) { .settings-grid-four, .processing-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
      @media (max-width: 560px) { main { padding: 20px 12px; } .page-head { display: block; } .file-row, .mode-load-form, .settings-grid-four, .settings-grid-two, .processing-grid { grid-template-columns: 1fr; } .button-setting-card { max-width: none; } }
    </style>
  </head>
  <body>
    <main>
      <div class="page-head">
        <h1>scannerserver</h1>
        <span class="muted">Version <!-- SCANNER_SERVER_VERSION --></span>
      </div>
      <!-- SCANNER_SERVER_CONTENT -->
    </main>
    <script>
      (() => {
        const selectAll = document.querySelector("[data-select-all]");
        const fileCheckboxes = Array.from(document.querySelectorAll('input[name="files"]'));
        const updateSelectAll = () => {
          if (!selectAll) return;
          const selectedCount = fileCheckboxes.filter((checkbox) => checkbox.checked).length;
          selectAll.checked = selectedCount === fileCheckboxes.length;
          selectAll.indeterminate = selectedCount > 0 && selectedCount < fileCheckboxes.length;
        };
        selectAll?.addEventListener("change", () => {
          fileCheckboxes.forEach((checkbox) => { checkbox.checked = selectAll.checked; });
          updateSelectAll();
        });
        fileCheckboxes.forEach((checkbox) => checkbox.addEventListener("change", updateSelectAll));
        updateSelectAll();

        const scannerSetup = document.querySelector("[data-scanner-setup]");
        const scannerDevices = scannerSetup?.querySelector("[data-scanner-devices]");
        const scannerError = scannerSetup?.querySelector("[data-scanner-setup-error]");
        const scannerStatus = scannerSetup?.querySelector("[data-scanner-discovery-status]");
        const renderScannerDevices = (devices) => {
          if (!scannerDevices) return;
          const currentIDs = Array.from(scannerDevices.querySelectorAll('input[name="device_id"]'))
            .map((input) => input.value).sort().join("\n");
          const nextIDs = devices.map((device) => device.id).sort().join("\n");
          if (currentIDs === nextIDs) return;
          scannerDevices.replaceChildren();
          if (devices.length === 0) return;

          const form = document.createElement("form");
          form.method = "post";
          form.action = "/setup/scanners/select";
          const list = document.createElement("div");
          list.className = "device-list";
          devices.forEach((device) => {
            const label = document.createElement("label");
            const input = document.createElement("input");
            input.type = "radio";
            input.name = "device_id";
            input.value = device.id;
            label.append(input, ` ${device.name} ${device.ipAddress}`);
            list.append(label);
          });
          const button = document.createElement("button");
          button.textContent = "Use selected scanner";
          form.append(list, button);
          scannerDevices.append(form);
        };
        const pollScannerSetup = async () => {
          try {
            const response = await fetch("/setup/scanners/state", { cache: "no-store" });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const state = await response.json();
            if (state.configured || (state.needsPassword && scannerSetup.dataset.needsPassword !== "true")) {
              window.location.reload();
              return;
            }
            renderScannerDevices(state.devices);
            if (scannerError) {
              scannerError.textContent = state.lastError;
              scannerError.hidden = state.lastError.length === 0;
            }
            if (scannerStatus) {
              scannerStatus.textContent = state.discoveryInProgress
                ? "Looking for scanners automatically… You can use manual setup at the same time."
                : "Automatic discovery is paused.";
            }
            if (!state.serviceAvailable) return;
          } catch (error) {
            if (scannerStatus) scannerStatus.textContent = "Automatic discovery will retry shortly.";
          }
          window.setTimeout(pollScannerSetup, 2000);
        };
        if (scannerSetup && scannerSetup.dataset.needsPassword !== "true") {
          pollScannerSetup();
        }

        const revision = SCANNER_SERVER_REVISION;
        const reconnect = () => window.setTimeout(waitForUpdate, 5000);
        async function waitForUpdate() {
          try {
            const response = await fetch(`/updates?since=${revision}`, { cache: "no-store" });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const nextRevision = Number.parseInt(await response.text(), 10);
            if (nextRevision > revision) {
              window.location.reload();
            } else {
              reconnect();
            }
          } catch (error) {
            reconnect();
          }
        }
        waitForUpdate();
      })();
    </script>
  </body>
</html>
