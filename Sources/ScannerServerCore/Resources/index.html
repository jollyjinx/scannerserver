<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- SCANNER_SERVER_REFRESH -->
    <title>scannerserver</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; --page: #f5f7f6; --panel: #fff; --subtle: #f0f3f2; --text: #17201e; --muted: #66706d; --border: #d9dfdc; --primary: #2378a8; --primary-hover: #1d6590; --primary-soft: #e7f3fb; --primary-button: #78bee8; --primary-button-hover: #5faedc; --primary-button-text: #0b2f45; --danger: #b42318; --danger-soft: #feeceb; --success: #16794b; --warning-text: #8a4b08; --shadow: 0 1px 2px rgb(23 32 30 / 6%), 0 8px 24px rgb(23 32 30 / 4%); }
      * { box-sizing: border-box; } body { margin: 0; background: var(--page); color: var(--text); } main { max-width: 1160px; margin: 0 auto; padding: 30px 24px 56px; }
      .page-head { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; } h1 { font-size: 27px; letter-spacing: -.03em; margin: 0; } h2 { font-size: 22px; letter-spacing: -.02em; margin: 0; } h3 { font-size: 16px; margin: 0; } p { line-height: 1.5; } a { color: var(--primary); }
      section { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin: 18px 0; box-shadow: var(--shadow); }
      .primary-nav { display: flex; gap: 6px; margin: 24px 0 18px; padding: 5px; width: max-content; max-width: 100%; overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--panel); } .primary-nav a { padding: 9px 15px; border-radius: 8px; color: var(--muted); font-size: 14px; font-weight: 700; text-decoration: none; white-space: nowrap; } .primary-nav a:hover { color: var(--text); background: var(--subtle); } .primary-nav a[aria-current="page"] { color: var(--primary-button-text); background: var(--primary-button); }
      .section-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 22px; } .section-heading .muted { margin: 7px 0 0; max-width: 680px; } .eyebrow { margin: 0 0 5px; color: var(--primary); font-size: 11px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; } .muted, .file-name { color: var(--muted); font-size: 13px; }
      form, .settings-grid, .setup-controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; align-items: end; } .stack-form, .setup-controls, .mode-editor-form, .documents-form, .inline-form { grid-template-columns: 1fr; } label { display: grid; gap: 7px; font-size: 14px; font-weight: 700; } input, select, button { min-width: 0; font: inherit; } input, select { width: 100%; padding: 10px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); color: var(--text); } input:focus, select:focus { outline: 3px solid var(--primary-soft); border-color: var(--primary); }
      button, .button-link { display: inline-flex; justify-content: center; align-items: center; min-height: 42px; padding: 10px 16px; border: 0; border-radius: 8px; background: var(--primary-button); color: var(--primary-button-text); font-weight: 750; text-decoration: none; cursor: pointer; } button:hover, .button-link:hover { background: var(--primary-button-hover); } button:disabled { opacity: .55; cursor: wait; } .primary-action { min-width: 150px; min-height: 47px; } .secondary-button, .secondary-link { background: var(--subtle); color: var(--text); } .secondary-button:hover, .secondary-link:hover { background: var(--border); } .danger-button { background: var(--danger); color: #fff; } .danger-button:hover { background: #8f1d14; } .compact-button { min-height: 34px; padding: 7px 11px; font-size: 13px; } .button-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
      .scan-form { grid-template-columns: minmax(280px, 1fr) auto; gap: 16px; align-items: center; max-width: 780px; } .button-preset-note { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; } .button-preset-note strong { color: var(--text); } .button-preset-note a { margin-left: auto; font-weight: 700; }
      .scanner-summary { padding: 12px 18px; box-shadow: none; } .scanner-name { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0; } .scanner-reachability { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 13px; font-weight: 650; } .scanner-reachability-dot { width: 9px; height: 9px; border-radius: 50%; background: #9aa0a6; } .scanner-reachability.reachable .scanner-reachability-dot { background: var(--success); }
      .activity-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; } .activity-card { min-width: 0; padding: 18px; border: 1px solid var(--border); border-radius: 11px; background: var(--subtle); } .activity-card-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; } .status, .status-pill { font-weight: 800; } .status-pill { padding: 4px 8px; border-radius: 999px; background: var(--border); font-size: 11px; } .status-pill.success { color: var(--success); background: #e4f4eb; } .status-pill.working { color: #175cd3; background: #e8f1ff; } .status-pill.error { color: var(--danger); background: var(--danger-soft); } .queue-count { color: var(--muted); font-size: 12px; } .technical-details { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px; } .technical-details summary { color: var(--muted); font-size: 13px; font-weight: 700; cursor: pointer; }
      .worker-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; } .worker-card { padding: 18px; border: 1px solid var(--border); border-radius: 11px; background: var(--subtle); } .worker-card-busy { border-color: #5b9bea; box-shadow: inset 3px 0 0 #2878d0; } .worker-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; } .worker-card-head p { margin: 5px 0 0; } .worker-facts { display: grid; gap: 9px; margin: 17px 0; } .worker-facts div { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 10px; } .worker-facts dt { color: var(--muted); font-size: 12px; font-weight: 700; } .worker-facts dd { margin: 0; font-size: 13px; overflow-wrap: anywhere; } .worker-active-jobs { margin: 14px 0; padding: 12px; border-radius: 8px; background: var(--primary-soft); font-size: 13px; } .worker-active-jobs p { margin: 8px 0 0; }
      .preset-layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 24px; align-items: start; } .preset-sidebar { padding: 14px; border: 1px solid var(--border); border-radius: 11px; background: var(--subtle); } .preset-sidebar h3 { padding: 4px 8px 12px; } .mode-list, .file-list { margin: 0; padding: 0; list-style: none; } .mode-list li + li { margin-top: 5px; } .mode-list a { display: grid; gap: 5px; padding: 11px; border-radius: 8px; color: var(--text); text-decoration: none; } .mode-list a:hover { background: var(--panel); } .mode-list a[aria-current="true"] { background: var(--panel); box-shadow: 0 0 0 1px var(--border); } .default-badge { justify-self: start; padding: 2px 6px; border-radius: 999px; color: var(--primary); background: var(--primary-soft); font-size: 10px; text-transform: uppercase; } .preset-editor { min-width: 0; } .editor-heading { padding-bottom: 15px; border-bottom: 1px solid var(--border); }
      .mode-editor-form { gap: 20px; margin-top: 2px; align-items: stretch; } .setting-group { min-width: 0; margin: 0; padding: 20px 0 0; border: 0; border-top: 1px solid var(--border); } .setting-group:first-of-type { border-top: 0; } .setting-group legend { padding-right: 10px; font-size: 15px; font-weight: 800; } .settings-grid { gap: 16px; align-items: start; } .settings-grid-four, .settings-grid-two { grid-template-columns: repeat(2, minmax(0, 1fr)); } .processing-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: stretch; } .setting-card, .button-setting-card { min-width: 0; padding: 14px; border: 1px solid var(--border); border-radius: 9px; background: var(--subtle); } .setting-card { display: grid; gap: 14px; align-content: start; } .button-setting-card { max-width: 520px; } .checkbox-setting { align-content: start; } .setting-help { color: var(--muted); font-size: 12px; font-weight: 400; line-height: 1.4; } .mode-actions { padding-top: 2px; }
      .document-actions { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 0; border-block: 1px solid var(--border); } .select-all { display: flex; align-items: center; gap: 8px; } .select-all input, .file-variant input { width: auto; } .file-groups > div { margin-top: 24px; } .file-groups h3 { margin-bottom: 8px; color: var(--muted); } .file-row { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 16px; padding: 16px 0; border-top: 1px solid var(--border); } .preview-link { display: block; } .file-preview { display: block; width: 112px; height: 148px; object-fit: contain; border: 1px solid var(--border); border-radius: 6px; background: var(--subtle); } .file-details { min-width: 0; } .document-title { display: inline-block; color: var(--text); font-size: 16px; font-weight: 800; text-decoration: none; } .document-title:hover { color: var(--primary); text-decoration: underline; } .file-variant { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; margin-top: 12px; } .file-variant .file-name { overflow-wrap: anywhere; }
      .notice, .warning { padding: 11px 13px; border-radius: 8px; font-weight: 700; } .notice { background: var(--primary-soft); color: var(--primary); } .warning { background: #fef4e6; color: var(--warning-text); } .empty-state { text-align: center; padding-block: 44px; } .empty-state .muted { max-width: 540px; margin: 8px auto 20px; } .empty-state.compact { margin-top: 18px; padding: 36px 20px; border: 1px dashed var(--border); border-radius: 10px; } pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; }
      @media (prefers-color-scheme: dark) { :root { --page: #111614; --panel: #1a211e; --subtle: #222a27; --text: #eef3f1; --muted: #aeb9b5; --border: #39433f; --primary: #78c8f2; --primary-hover: #9bd7f6; --primary-soft: #17364a; --primary-button: #78c8f2; --primary-button-hover: #9bd7f6; --primary-button-text: #092b40; --danger: #d74b40; --danger-soft: #422321; --success: #62d496; } .secondary-button, .secondary-link { color: var(--text); } .danger-button { color: #fff; } .status-pill.working { color: #8bb8ff; background: #223a5f; } .status-pill.success { background: #183b2a; } }
      @media (max-width: 820px) { .preset-layout { grid-template-columns: 1fr; } .mode-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; } .mode-list li + li { margin-top: 0; } .processing-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
      @media (max-width: 600px) { main { padding: 20px 12px 40px; } .page-head { display: block; } .page-head .muted { display: block; margin-top: 4px; } .primary-nav { width: 100%; } section { padding: 18px; border-radius: 11px; } .section-heading { display: grid; } .scan-form, .activity-grid, .settings-grid-four, .settings-grid-two, .processing-grid, .file-row { grid-template-columns: 1fr; } .primary-action { width: 100%; } .button-preset-note a { margin-left: 0; } .mode-list { grid-template-columns: 1fr; } .button-setting-card { max-width: none; } .file-row { grid-template-columns: 84px minmax(0, 1fr); } .file-preview { width: 84px; height: 112px; } .file-variant { align-items: flex-start; } }
    </style>
  </head>
  <body>
    <main>
      <div class="page-head">
        <h1>scannerserver</h1>
        <span class="muted">Version <!-- SCANNER_SERVER_VERSION --></span>
      </div>
      <!-- SCANNER_SERVER_CONTENT -->
    </main>
    <script>
      (() => {
        document.addEventListener("submit", (event) => {
          const message = event.submitter?.dataset.confirm;
          if (message && !window.confirm(message)) event.preventDefault();
        });

        const presetSelect = document.querySelector("[data-preset-select]");
        const presetSummary = document.querySelector("[data-preset-summary]");
        const updatePresetSummary = () => {
          if (presetSelect && presetSummary) {
            presetSummary.textContent = presetSelect.selectedOptions[0]?.dataset.summary || "";
          }
        };
        presetSelect?.addEventListener("change", updatePresetSummary);
        updatePresetSummary();

        const selectAll = document.querySelector("[data-select-all]");
        const fileCheckboxes = Array.from(document.querySelectorAll('input[name="files"]'));
        const updateSelectAll = () => {
          if (!selectAll) return;
          const selectedCount = fileCheckboxes.filter((checkbox) => checkbox.checked).length;
          selectAll.checked = selectedCount === fileCheckboxes.length;
          selectAll.indeterminate = selectedCount > 0 && selectedCount < fileCheckboxes.length;
        };
        selectAll?.addEventListener("change", () => {
          fileCheckboxes.forEach((checkbox) => { checkbox.checked = selectAll.checked; });
          updateSelectAll();
        });
        fileCheckboxes.forEach((checkbox) => checkbox.addEventListener("change", updateSelectAll));
        updateSelectAll();

        const scannerSetup = document.querySelector("[data-scanner-setup]");
        const scannerDevices = scannerSetup?.querySelector("[data-scanner-devices]");
        const scannerError = scannerSetup?.querySelector("[data-scanner-setup-error]");
        const scannerStatus = scannerSetup?.querySelector("[data-scanner-discovery-status]");
        const manualSetupForm = scannerSetup?.querySelector("[data-scanner-manual-form]");
        const manualIPAddress = manualSetupForm?.querySelector('input[name="scanner_ip"]');
        const manualCredential = manualSetupForm?.querySelector('input[name="scanner_credential"]');
        const manualSetupStorageKey = "scannerserver.manualSetup";
        const manualSetupOutcome = new URLSearchParams(window.location.search).get("setup");
        const restoreSubmittedIPAddress = [
          "manual-missing", "manual-not-found", "manual-invalid", "password-failed", "unavailable",
        ].includes(manualSetupOutcome);
        const saveManualSetup = () => {
          if (!manualIPAddress || !manualCredential) return;
          try {
            window.sessionStorage.setItem(manualSetupStorageKey, JSON.stringify({
              ipAddress: manualIPAddress.value,
              credential: manualCredential.value,
            }));
          } catch (_) {}
        };
        if (manualIPAddress && manualCredential) {
          try {
            const saved = JSON.parse(window.sessionStorage.getItem(manualSetupStorageKey) || "null");
            if ((restoreSubmittedIPAddress || !manualIPAddress.value) && saved?.ipAddress) {
              manualIPAddress.value = saved.ipAddress;
            }
            if (saved?.credential) manualCredential.value = saved.credential;
          } catch (_) {}
          manualIPAddress.addEventListener("input", saveManualSetup);
          manualCredential.addEventListener("input", saveManualSetup);
          manualSetupForm.addEventListener("submit", saveManualSetup);
        } else {
          try { window.sessionStorage.removeItem(manualSetupStorageKey); } catch (_) {}
        }
        const renderScannerDevices = (devices) => {
          if (!scannerDevices) return;
          const currentIDs = Array.from(scannerDevices.querySelectorAll('input[name="device_id"]'))
            .map((input) => input.value).sort().join("\n");
          const nextIDs = devices.map((device) => device.id).sort().join("\n");
          if (currentIDs === nextIDs) return;
          scannerDevices.replaceChildren();
          if (devices.length === 0) return;

          const form = document.createElement("form");
          form.method = "post";
          form.action = "/setup/scanners/select";
          const list = document.createElement("div");
          list.className = "device-list";
          devices.forEach((device) => {
            const label = document.createElement("label");
            const input = document.createElement("input");
            input.type = "radio";
            input.name = "device_id";
            input.value = device.id;
            label.append(input, ` ${device.name} ${device.ipAddress}`);
            list.append(label);
          });
          const button = document.createElement("button");
          button.textContent = "Use selected scanner";
          form.append(list, button);
          scannerDevices.append(form);
        };
        const pollScannerSetup = async () => {
          try {
            const response = await fetch("/setup/scanners/state", { cache: "no-store" });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const state = await response.json();
            if (state.configured || (state.needsPassword && scannerSetup.dataset.needsPassword !== "true")) {
              window.location.reload();
              return;
            }
            renderScannerDevices(state.devices);
            if (scannerError) {
              scannerError.textContent = state.lastError;
              scannerError.hidden = state.lastError.length === 0;
            }
            if (scannerStatus) {
              scannerStatus.textContent = state.discoveryInProgress
                ? "Looking for scanners automatically… You can use manual setup at the same time."
                : "Automatic discovery is paused.";
            }
            if (!state.serviceAvailable) return;
          } catch (error) {
            if (scannerStatus) scannerStatus.textContent = "Automatic discovery will retry shortly.";
          }
          window.setTimeout(pollScannerSetup, 2000);
        };
        if (scannerSetup
            && scannerSetup.dataset.configured !== "true"
            && scannerSetup.dataset.needsPassword !== "true") {
          pollScannerSetup();
        }

        const revision = SCANNER_SERVER_REVISION;
        const reconnect = () => window.setTimeout(waitForUpdate, 5000);
        async function waitForUpdate() {
          try {
            const response = await fetch(`/updates?since=${revision}`, { cache: "no-store" });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const nextRevision = Number.parseInt(await response.text(), 10);
            if (nextRevision > revision) {
              window.location.reload();
            } else {
              reconnect();
            }
          } catch (error) {
            reconnect();
          }
        }
        waitForUpdate();
      })();
    </script>
  </body>
</html>
